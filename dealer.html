<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dealer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script>
        if (localStorage.getItem('isDealerLoggedIn') !== 'true') {
            alert('Anda harus login terlebih dahulu!');
            window.location.href = 'login.html';
        }
    </script>

</head>
<body class="p-4">
    <div class="container">
       <div class="d-flex justify-content-between align-items-center">
            <h1>Dealer Dashboard</h1>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
        <hr>
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">Atur Jadwal & Kuota</div>
            <div class="card-body">
                <form id="scheduleForm" class="row g-3">
                    <div class="col-auto">
                        <input type="date" id="schedDate" class="form-control" required>
                    </div>
                    <div class="col-auto">
                        <input type="number" id="schedQuota" class="form-control" placeholder="Jumlah Kuota" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-success">Set Jadwal</button>
                    </div>
                </form>
            </div>
        </div>

        <h3>Daftar Pemesanan Servis</h3>
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Nama</th>
                    <th>Mobil / Plat</th>
                    <th>Keluhan</th>
                    <th>Status Saat Ini</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="bookingTable">
                </tbody>
        </table>
    </div>

    <script>
        // Set Jadwal
        document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                date: document.getElementById('schedDate').value,
                quota: document.getElementById('schedQuota').value
            };
            await fetch('http://localhost:3000/api/schedules', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            alert('Jadwal berhasil diupdate');
        });

        // Load Bookings
        function loadBookings() {
            fetch('http://localhost:3000/api/bookings')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('bookingTable');
                tbody.innerHTML = '';
                data.forEach(b => {
                    const date = new Date(b.service_date).toISOString().split('T')[0];
                    tbody.innerHTML += `
                        <tr>
                            <td>${date} <br> ${b.service_time}</td>
                            <td>${b.customer_name} <br> ${b.phone}</td>
                            <td>${b.car_type} <br> ${b.plate_number}</td>
                            <td>${b.complaint}</td>
                            <td><span class="badge bg-secondary">${b.status}</span></td>
                            <td>
                                <select onchange="updateStatus(${b.id}, this.value)" class="form-select form-select-sm">
                                    <option value="" disabled selected>Ubah Status</option>
                                    <option value="Menunggu Konfirmasi">Menunggu Konfirmasi</option>
                                    <option value="Konfirmasi Datang">Konfirmasi Datang</option>
                                    <option value="Konfirmasi Batal">Konfirmasi Batal</option>
                                    <option value="Datang">Datang</option>
                                    <option value="Tidak Datang">Tidak Datang</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        async function updateStatus(id, newStatus) {
            if(!confirm(`Ubah status menjadi ${newStatus}?`)) return;
            
            await fetch(`http://localhost:3000/api/bookings/${id}/status`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ newStatus })
            });
            loadBookings(); // Refresh table
        }

        function logout() {
            localStorage.removeItem('isDealerLoggedIn');
            window.location.href = 'index.html';
        }
        loadBookings();
    </script>
</body>
</html>
