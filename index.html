<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Servis - Bengkel Mobil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background-color: #0d6efd;
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Bengkel Mobil Maju</a>
            <div class="d-flex">
                <a href="login.html" class="btn btn-outline-primary btn-sm">Login Dealer</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">
        <div class="container">
            <h1>Selamat Datang di Layanan Servis Online</h1>
            <p class="lead">Isi formulir di bawah ini untuk menjadwalkan servis mobil Anda</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="card shadow border-0 mx-auto" style="max-width: 700px;">
            <div class="card-body p-4">
                <h4 class="card-title mb-4">Formulir Pemesanan Servis</h4>
                
                <form id="bookingForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" id="name" class="form-control" placeholder="Contoh: Budi Santoso" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">No. Handphone</label>
                            <input type="text" id="phone" class="form-control" placeholder="08xxxxxx" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Jenis Mobil</label>
                            <input type="text" id="car_type" class="form-control" placeholder="Contoh: Avanza 2020" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Plat Nomor</label>
                            <input type="text" id="plate" class="form-control" placeholder="AB 1234 XY" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Keluhan Kendaraan</label>
                        <textarea id="complaint" class="form-control" rows="3" placeholder="Contoh: Rem bunyi berdecit, ganti oli, dll." required></textarea>
                    </div>

                    <div class="alert alert-info py-2 small">
                        <i class="bi bi-info-circle"></i> Pemesanan hanya bisa dilakukan untuk H+1.
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Pilih Tanggal Servis</label>
                            <select id="date" class="form-select" required>
                                <option value="">Sedang memuat jadwal...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Jam Servis</label>
                            <input type="time" id="time" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg">Kirim Pemesanan Servis</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-muted small">
        &copy; 2026 Bengkel Mobil Maju. All rights reserved.
    </footer>

    <script>
        const API_BASE = ''; // Kosongkan agar otomatis ikut domain Vercel

        // 1. Load Tanggal (Versi Debugging)
        fetch(`${API_BASE}/api/schedules/available`)
            .then(async res => {
                // Cek apakah server membalas dengan sukses (Status 200 OK)
                if (!res.ok) {
                    const text = await res.text(); // Baca pesan error ASLI dari server
                    throw new Error(`Server Error (${res.status}): ${text}`);
                }
                return res.json();
            })
            .then(data => {
                const select = document.getElementById('date');
                select.innerHTML = '<option value="">-- Pilih Tanggal Tersedia --</option>';
                
                // Cek jika data yang diterima bukan Array
                if (!Array.isArray(data)) {
                    console.log("Data aneh:", data); // Intip datanya di console
                    throw new Error("Format data dari server salah. Cek Console.");
                }

                if (data.length === 0) {
                    select.innerHTML = '<option value="">Tidak ada jadwal tersedia</option>';
                } else {
                    data.forEach(item => {
                        const dateObj = new Date(item.service_date);
                        const formatted = dateObj.toISOString().split('T')[0];
                        select.innerHTML += `<option value="${formatted}">${formatted} (Sisa Kuota: ${item.quota})</option>`;
                    });
                }
            })
            .catch(err => {
                console.error("DEBUG ERROR:", err);
                // INI YANG AKAN MENAMPILKAN ERROR SEBENARNYA
                alert("GAGAL LOAD JADWAL:\n" + err.message);
            });

        // 2. Handle Submit Form
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                car_type: document.getElementById('car_type').value,
                plate: document.getElementById('plate').value,
                complaint: document.getElementById('complaint').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value
            };

            try {
                const res = await fetch(`${API_BASE}/api/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                
                if(res.ok) {
                    alert("Sukses! " + result.message);
                    window.location.reload(); 
                } else {
                    alert("Gagal: " + (result.message || JSON.stringify(result)));
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi:\n" + err.message);
            }
        });
    </script>
</body>
</html>
